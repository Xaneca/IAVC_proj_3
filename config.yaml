source: 0                      # 0 = webcam, ou caminho para um ficheiro de vídeo

detector:
  model_path: models/det_10g.onnx
  input_size: 640
  min_score: 0.5
  nms_threshold: 0.4

backbone:
  weights: models/arcface_r50.pth
  device: cpu                  # ou cuda

heads:
  age_gender: models/age_gender.pt
  expression: models/expression.pt
  min_confidence: 0.6          # abaixo disto mostra "?" (incerto)

gallery:
  dir: gallery
  threshold: 0.40              # PROVISÓRIO: calibrar com eval/eval_identity.py
  enrol_frames: 10             # nº de frames capturados ao registar uma pessoa

modules:
  age_gender: true
  expression: true
  identity: true

data:
  age_gender:
    path: data/UTKFace/UTKFace
    script: scripts/prepare_utkface.py
  expression: data/AffectNET/AffectNetCustom
  detection: data/WIDERFACE/WIDER_test/images
