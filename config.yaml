source: 0                      # 0 = webcam, ou caminho para um ficheiro de vídeo

detector:
  model_path: models/det_10g.onnx
  input_size: 640
  min_score: 0.5
  nms_threshold: 0.4

backbone:
  weights: models/arcface_r50.pt   # gerado por python -m scripts.export_backbone
  device: cuda                 # ou cpu (sem CUDA, cai para cpu)

heads:
  weights: models/multitask_frozen.pt # stages afinados + cabeças (python -m train.train_multitask)
  min_confidence: 0.6          # abaixo disto mostra "?" (incerto)

gallery:
  dir: gallery
  threshold: 0.40              # PROVISÓRIO: calibrar com eval/eval_identity.py
  enrol_frames: 10             # nº de frames capturados ao registar uma pessoa

modules:
  age_gender: true
  expression: true
  identity: true

data:
  age_gender:
    path: data/UTKFace/UTKFace
    script: scripts/prepare_utkface.py
  expression: data/AffectNET/AffectNetCustom
  detection: data/WIDERFACE/WIDER_test/images

train:                         # python -m train.train_multitask
  crops:                       # pastas dos crops 112×112 (mesmos nomes que o "path" dos CSVs)
    utkface: data/processed_black_border/utkface_112                # resize; alinhados pelo SCRFD: data/processed_black_border/utkface_112
    affectnet: data/processed/affectnet_112
  feature_stage: 3             # cabeças sobre o stage 3 (256×14×14) ou 4 (512×7×7)
  trainable_stages: []         # stages afinados, entre 3 e feature_stage ([] = só as MLP treinam)
  device: cuda
  batch_size: 64               # por dataset: cada passo = 64 UTKFace + 64 AffectNet
  epochs: 30
  patience: 5                  # early stopping pela loss conjunta de validação
  lr_heads: 1.0e-3
  lr_backbone: 1.0e-4
  weight_decay: 1.0e-4
  loss_weights: {age: 1.0, gender: 1.0, expression: 1.0}
  num_workers: 4
  seed: 42
  output: models/multitask_frozen.pt   # outros: multitask.pt (stage 3 afinado), multitask_s4.pt (stage 4 afinado)
